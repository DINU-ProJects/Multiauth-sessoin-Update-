<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f0f1a; min-height: 100vh; }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { color: white; font-size: 24px; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a, .logout-btn {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            border: none;
            cursor: pointer;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }
        .stat-card h3 { color: #aaa; font-size: 14px; margin-bottom: 10px; }
        .stat-card .value { font-size: 36px; font-weight: bold; color: #667eea; }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .card h2 { color: white; margin-bottom: 20px; border-left: 4px solid #667eea; padding-left: 15px; }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            margin-bottom: 15px;
        }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); color: #ddd; }
        th { background: rgba(255,255,255,0.05); color: white; }
        .status-active { color: #10b981; }
        .status-inactive { color: #ef4444; }
        .delete-btn { background: #ef4444; padding: 5px 12px; font-size: 12px; }
        .view-btn { background: #3b82f6; padding: 5px 12px; font-size: 12px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            max-width: 600px;
            width: 90%;
        }
        .modal-content pre { background: #0f0f1a; padding: 15px; border-radius: 10px; color: #10b981; overflow-x: auto; }
        .close-modal { float: right; font-size: 24px; cursor: pointer; color: white; }
        .loading { color: #aaa; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>⚙️ Admin Dashboard</h1>
        <div class="nav-links">
            <a href="/">Home</a>
            <button class="logout-btn" onclick="window.location.href='/'">Logout</button>
        </div>
    </nav>
    
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Sessions</h3><div class="value" id="totalSessions">0</div></div>
            <div class="stat-card"><h3>Active Sessions</h3><div class="value" id="activeSessions">0</div></div>
        </div>
        
        <div class="card">
            <h2>📱 Active Sessions</h2>
            <input type="text" id="searchInput" placeholder="Search by number...">
            <div id="sessionsList"><div class="loading">Loading...</div></div>
        </div>
    </div>

    <div id="credsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3>Session Credentials</h3>
            <pre id="credsContent"></pre>
        </div>
    </div>

    <script>
        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                if (data.success) displaySessions(data.sessions);
            } catch(e) { document.getElementById('sessionsList').innerHTML = '<div class="loading">Error</div>'; }
        }
        
        function displaySessions(sessions) {
            const container = document.getElementById('sessionsList');
            if (!sessions || sessions.length === 0) { container.innerHTML = '<div class="loading">No sessions</div>'; return; }
            
            let html = '<table><thead><tr><th>Number</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>';
            sessions.forEach(s => {
                const created = new Date(s.createdAt).toLocaleString();
                html += `<tr><td>${s.number}</td><td class="${s.active ? 'status-active' : 'status-inactive'}">${s.active ? 'Active' : 'Inactive'}</td><td>${created}</td>
                        <td><button class="view-btn" onclick="viewCreds('${s.number}')">View</button> <button class="delete-btn" onclick="deleteSession('${s.number}')">Delete</button></td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            
            document.getElementById('totalSessions').textContent = sessions.length;
            document.getElementById('activeSessions').textContent = sessions.filter(s => s.active).length;
        }
        
        async function viewCreds(number) {
            const res = await fetch(`/api/session/${number}`);
            const data = await res.json();
            if (data.success && data.creds) {
                document.getElementById('credsContent').textContent = JSON.stringify(data.creds, null, 2);
                document.getElementById('credsModal').style.display = 'flex';
            }
        }
        
        async function deleteSession(number) {
            if (!confirm(`Delete ${number}?`)) return;
            await fetch(`/api/session/${number}`, { method: 'DELETE' });
            loadSessions();
        }
        
        function closeModal() { document.getElementById('credsModal').style.display = 'none'; }
        
        document.getElementById('searchInput').addEventListener('input', async (e) => {
            const search = e.target.value.toLowerCase();
            const res = await fetch('/api/sessions');
            const data = await res.json();
            if (data.success) {
                const filtered = data.sessions.filter(s => s.number.includes(search));
                displaySessions(filtered);
            }
        });
        
        loadSessions();
        setInterval(loadSessions, 30000);
    </script>
</body>
</html>
