<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .btn-group { display: flex; gap: 15px; flex-direction: column; margin-bottom: 30px; }
        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .qr-btn { background: #48bb78; color: white; }
        .code-btn { background: #667eea; color: white; }
        .admin-btn { background: #ed8936; color: white; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        .pair-code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #667eea;
            margin: 10px 0;
        }
        footer { margin-top: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 WhatsApp Bot</h1>
        <p class="subtitle">Connect your WhatsApp</p>
        
        <input type="text" id="number" placeholder="Enter number (e.g., 947xxxxxxxx)">
        
        <div class="btn-group">
            <button class="code-btn" onclick="pairWithCode()">🔐 Pair with 8-Digit Code</button>
            <button class="qr-btn" onclick="window.location.href='/qr'">📱 Pair with QR (No Number)</button>
            <button class="admin-btn" onclick="window.location.href='/dashboard'">⚙️ Admin Dashboard</button>
        </div>
        
        <div id="result" class="result"></div>
        <footer>© WhatsApp Bot</footer>
    </div>

    <script>
        async function pairWithCode() {
            const number = document.getElementById('number').value;
            if (!number) { alert('Enter your number'); return; }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div>⏳ Requesting code...</div>';
            
            try {
                const res = await fetch('/api/pair/code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: number })
                });
                const data = await res.json();
                
                if (data.code) {
                    resultDiv.innerHTML = `<div style="color: green">✅ Code generated!</div><div class="pair-code">${data.code}</div><p>Open WhatsApp → Settings → Linked Devices → Link with Code</p>`;
                } else if (data.status === 'already_paired') {
                    resultDiv.innerHTML = '<div style="color: green">✅ Already connected!</div>';
                } else {
                    resultDiv.innerHTML = '<div style="color: red">❌ Failed. Try again.</div>';
                }
            } catch(e) {
                resultDiv.innerHTML = '<div style="color: red">❌ Error</div>';
            }
        }
    </script>
</body>
</html>
