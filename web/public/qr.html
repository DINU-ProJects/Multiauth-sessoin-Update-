<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - WhatsApp Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin: 10px;
        }
        .back-btn { background: #666; }
        .qr-container { margin-top: 20px; }
        img { width: 250px; height: 250px; margin: 20px auto; border-radius: 15px; }
        .status { margin-top: 15px; padding: 10px; border-radius: 10px; }
        .waiting { background: #fef3c7; color: #92400e; }
        .
