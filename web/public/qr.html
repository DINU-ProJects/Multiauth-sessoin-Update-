<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - WhatsApp Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin: 10px;
        }
        .back-btn { background: #666; }
        .qr-container { margin-top: 20px; }
        img { width: 250px; height: 250px; margin: 20px auto; border-radius: 15px; }
        .status { margin-top: 15px; padding: 10px; border-radius: 10px; }
        .waiting { background: #fef3c7; color: #92400e; }
        .connected { background: #d4edda; color: #155724; }
        .loading { color: #667eea; }
        .error { color: #e53e3e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Scan QR Code</h1>
        <p>No number needed - Just scan!</p>
        <button onclick="generateQR()">Generate QR Code</button>
        <button class="back-btn" onclick="window.location.href='/'">← Back</button>
        <div id="qrContainer" class="qr-container"></div>
        <div id="status"></div>
    </div>

    <script>
        let statusInterval = null;
        
        async function generateQR() {
            const container = document.getElementById('qrContainer');
            const statusDiv = document.getElementById('status');
            
            container.innerHTML = '<div class="loading">⏳ Generating QR...</div>';
            statusDiv.innerHTML = '';
            if (statusInterval) clearInterval(statusInterval);
            
            try {
                const res = await fetch('/api/generate-qr');
                const data = await res.json();
                
                if (data.qr) {
                    container.innerHTML = `<img src="${data.qr}" />`;
                    statusDiv.innerHTML = '<div class="status waiting">⏳ Scan with WhatsApp</div>';
                    
                    statusInterval = setInterval(async () => {
                        const check = await fetch('/api/qr-status');
                        const status = await check.json();
                        if (status.connected) {
                            clearInterval(statusInterval);
                            statusDiv.innerHTML = '<div class="status connected">✅ Connected! Redirecting...</div>';
                            setTimeout(() => { window.location.href = '/'; }, 2000);
                        }
                    }, 3000);
                } else {
                    container.innerHTML = '<div class="error">❌ Failed to generate QR</div>';
                }
            } catch(e) {
                container.innerHTML = '<div class="error">❌ Error generating QR</div>';
            }
        }
    </script>
</body>
</html>
